name: Python backend CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Check formatting and lint
        run: uv run ruff check .
        working-directory: backend

      - name: Validate front-door safety invariants
        run: python ../infra/front-door/validate.py
        working-directory: backend

      - name: Validate data-retention no-delete invariants
        run: python ../infra/data-retention/validate.py
        working-directory: backend

      - name: Run tests
        run: uv run pytest
        working-directory: backend

  consumer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out reviewed TRS-80 client source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: apuder/TRS-80
          ref: aecbddcc7f5515fb844bb7a1fc350d8ffaaf5ce5
          path: .consumer-sources/TRS-80
          persist-credentials: false
          sparse-checkout: |
            shared/src/commonMain/kotlin/org/retrostore/RetrostoreClient.kt
            shared/src/commonMain/kotlin/org/retrostore/ApiException.kt
            shared/src/commonMain/proto/org/retrostore/client/common/proto/ApiProtos.proto
            shared/src/commonMain/kotlin/org/puder/trs80/shared/io/HttpGet.kt
            shared/src/commonMain/kotlin/org/puder/trs80/shared/store/RetroStore.kt
            shared/src/androidMain/kotlin/org/puder/trs80/shared/io/HttpGet.android.kt
            shared/src/iosMain/kotlin/org/puder/trs80/shared/io/HttpGet.ios.kt
            shared/src/wasmJsMain/kotlin/org/puder/trs80/shared/io/HttpGet.wasmJs.kt
            app/src/main/c/retrostore
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install locked Python dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Run real public clients against Flask candidate
        run: >-
          uv run python -m retrostore.contract.consumer_clients
          --trs80-checkout ../.consumer-sources/TRS-80
        working-directory: backend
