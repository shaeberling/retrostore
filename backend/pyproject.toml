[project]
name = "retrostore-backend"
version = "0.1.0"
description = "RetroStore Cloud Run compatibility API and administration services"
readme = "README.md"
requires-python = ">=3.14.6,<3.15"
dependencies = [
    "firebase-admin>=7.5,<8",
    "flask>=3.1.3,<4",
    "google-cloud-datastore>=2.26,<3",
    "google-cloud-firestore>=2.28,<3",
    "google-cloud-storage>=3.13,<4",
    "gunicorn>=26,<27",
    "protobuf>=7.35.1,<8",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.83,<2",
    "httpx>=0.28.1,<1",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16.1,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["retrostore/generated"]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
